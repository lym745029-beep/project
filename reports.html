<!DOCTYPE html>
<html>
<head><title>Reports</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body><div class="container mt-4">
<h2>Production Reports</h2>
<table class="table">
<thead><tr><th>Date</th><th>Well</th><th>Oil</th><th>Gas</th></tr></thead>
<tbody>{% for row in data %}<tr><td>{{ row.prod_date }}</td><td>{{ row.well_name }}</td><td>{{ row.oil_barrels }}</td><td>{{ row.gas_mcf }}</td></tr>{% endfor %}</tbody>
</table>
<a href="/" class="btn btn-secondary">Back</a>
</div></body></html>
