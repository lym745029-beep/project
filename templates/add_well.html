<!DOCTYPE html>
<html>
<head><title>Add Well</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body><div class="container mt-4">
<h2>Add New Well</h2>
<form method="POST">
    <input class="form-control mb-2" name="well_name" placeholder="Well Name" required>
    <input class="form-control mb-2" name="location" placeholder="Location" required>
    <select class="form-control mb-2" name="type"><option>Oil</option><option>Gas</option></select>
    <input class="form-control mb-2" type="date" name="drill_date" value="{{ today }}" required>
    <button class="btn btn-primary">Save Well</button>
</form></div></body></html>
